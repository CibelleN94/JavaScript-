<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <div> <h1>Qual é o seu país de origem?</h1></div>
    <input type="text" name="txt1" id="txt1" placeholder="Sua resposta aqui">
    <input type="button" value="verificar" onclick="consultar">
 <div name="res" id="res"></div>

 <script>
    function consultar () {
        var txtpais = window.document.querySelector('input#txt1')
        var res = window.document.querySelector('div#res')
        var pais = txtpais.value
        res.innerHTML = `Seu pais de origem é ${pais}`

        if (pais == 'Brasil') {
            res.innerHTML += `<p>Você é brasileiro</p>`

        }

        else {
            res.innerHTML += `<p>Você é estrangeiro</p>`
        }
    res.innerHTML += '<p> Tenha uma boa estadia</p>'
        
    }
 </script>
</body>
</html>
