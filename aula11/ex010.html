<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
    <style> 
        body {
            background-color: rgb(204, 204, 204);

    }
        h1 {
            color: #000000;
        }

        input#vel {
            width:150px;
           
        }
    </style>
</head>

<body>
    <h1>Sistema para verificar velocidade</h1>
   Velocidade do carro: <input type="number" name="vel" id="vel"> km/h
    <input type="button" id="velres" value="Verificar" onclick="clicar()">
    <div id="res"></div>

    <script> 
    
        function clicar(){
            var txtvel = window.document.getElementById('vel')
            var res = window.document.querySelector('div#res')
            var vel = Number(txtvel.value)
            res.innerHTML = `Sua velocidade é de <strong>${vel}km/h</strong>.`

            if (vel > 60) {
                res.innerHTML += `<p>Voce está multado!</p>` 
            }
            else {
                res.innerHTML += `<p>Use o cinto. Dirija com cuidado!</p>`
            }
        }
    </script>
</body>
</html>
